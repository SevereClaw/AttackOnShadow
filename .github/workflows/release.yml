# Builds AttackOnShadow.exe on every change and, when mod/version.json has a
# version without a tag yet, publishes a GitHub release with the exe attached.
# The in-app updater (МОД → Обновления мода) downloads that exe and runs it silently.
name: Build & Release

on:
  push:
    branches: [main]
    paths: [mod/**, patch/**, setup/**, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax check (JS)
        run: |
          foreach ($f in 'mod/theme/aos-theme.js','mod/theme/aos-features.js','mod/main/aos-main.js','patch/patch.js') { node --check $f; if ($LASTEXITCODE) { exit 1 } }

      - name: Build exe
        run: ./setup/build.ps1

      - name: Smoke test
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'aos-extract'
          $p = Start-Process setup/out/AttackOnShadow.exe -ArgumentList '--extract', "`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "extract exit code $($p.ExitCode)" }
          foreach ($f in 'mod/version.json','mod/main/aos-main.js','mod/theme/aos-theme.css','mod/assets/icon.png','patch/patch.js') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f in payload" }
          }
          # the patcher must refuse cleanly when there is no driver
          node (Join-Path $dir 'patch/patch.js') status (Join-Path $env:RUNNER_TEMP 'nothing-here')
          if ($LASTEXITCODE -ne 2) { throw "patch.js status: expected exit 2, got $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          Write-Host 'payload OK'

      - uses: actions/upload-artifact@v4
        with:
          name: AttackOnShadow-exe
          path: setup/out/AttackOnShadow.exe

      - name: Read version
        id: v
        run: |
          $v = (Get-Content mod/version.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          git rev-parse "v$v" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          $global:LASTEXITCODE = 0

      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.v.outputs.version }}'
          $notesFile = "docs/release-notes/v$v.md"
          if (Test-Path $notesFile) { Copy-Item $notesFile notes.md }
          else {
            $prev = git describe --tags --abbrev=0 2>$null
            $range = if ($prev) { "$prev..HEAD" } else { 'HEAD' }
            git log --pretty='- %s' $range | Set-Content notes.md -Encoding utf8
          }
          Add-Content notes.md "`n`n**Установка:** скачай **AttackOnShadow.exe** ниже и запусти. Уже стоит мод — он обновится сам (или: МОД → Обновления мода)." -Encoding utf8
          gh release create "v$v" setup/out/AttackOnShadow.exe --target "${{ github.sha }}" --title "AttackOnShadow v$v" --notes-file notes.md
