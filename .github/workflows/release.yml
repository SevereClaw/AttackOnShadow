# Builds the AttackOnShadow app (app/) on Windows, runs the protocol self-test,
# renders every screen with a simulated keyboard, and — when VERSION has no tag
# yet — publishes a release with AttackOnShadow.exe. Add "[skip release]" to a
# commit message to build and test without publishing.
name: Build & Release

on:
  push:
    branches: [main]
    paths: [app/**, VERSION, docs/release-notes/**, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: v
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          git rev-parse "v$v" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          $global:LASTEXITCODE = 0

      - name: Build
        run: |
          dotnet build app/AttackOnShadow.csproj -c Release -p:Version=${{ steps.v.outputs.version }} -p:InformationalVersion=${{ steps.v.outputs.version }} -o out
          if ($LASTEXITCODE) { exit 1 }
          Get-Item out/AttackOnShadow.exe | Format-List Name, Length

      - name: Self-test (protocol)
        run: |
          $p = Start-Process out/AttackOnShadow.exe -ArgumentList '--selftest', "`"$env:RUNNER_TEMP\selftest.txt`"" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\selftest.txt"
          if ($p.ExitCode -ne 0) { throw "selftest exit $($p.ExitCode)" }

      - name: Screenshots
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'shots'
          $p = Start-Process out/AttackOnShadow.exe -ArgumentList '--screenshot', "`"$dir`"" -Wait -PassThru
          if (Test-Path "$dir/error.txt") { Get-Content "$dir/error.txt" }
          if ($p.ExitCode -ne 0) { throw "screenshot exit $($p.ExitCode)" }
          Get-ChildItem $dir

      - name: Publish screenshots to the ci-screenshots branch
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'shots'
          $wt = Join-Path $env:RUNNER_TEMP 'shots-branch'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add --detach $wt
          Push-Location $wt
          git checkout --orphan ci-screenshots
          git rm -rfq . 2>$null
          Copy-Item "$dir/*.png" .
          "Screenshots of ${{ github.sha }} (simulated keyboard)" | Set-Content README.md
          git add -A
          git commit -qm "screenshots for ${{ github.sha }}"
          git push -f origin ci-screenshots
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots

      - uses: actions/upload-artifact@v4
        with:
          name: AttackOnShadow-exe
          path: out/AttackOnShadow.exe

      - name: Publish release
        if: steps.v.outputs.exists == 'false' && !contains(github.event.head_commit.message, '[skip release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.v.outputs.version }}'
          $notesFile = "docs/release-notes/v$v.md"
          if (Test-Path $notesFile) { Copy-Item $notesFile notes.md }
          else {
            $prev = git describe --tags --abbrev=0 2>$null
            $range = if ($prev) { "$prev..HEAD" } else { 'HEAD' }
            git log --pretty='- %s' $range | Set-Content notes.md -Encoding utf8
          }
          Add-Content notes.md "`n`n**Установка:** скачай **AttackOnShadow.exe** и запусти. Уже стоит — обновится само." -Encoding utf8
          gh release create "v$v" out/AttackOnShadow.exe --target "${{ github.sha }}" --title "AttackOnShadow v$v" --notes-file notes.md
